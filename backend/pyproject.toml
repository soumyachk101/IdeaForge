[project]
name = "ideaforge"
version = "0.1.0"
description = "Multi-Agent Micro-SaaS Idea Discovery Engine"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.28.0",
    "crewai-tools>=0.1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.1",
    "httpx>=0.27.0",
    "pydantic>=2.7.1",
    "praw>=7.7.0",
    "beautifulsoup4>=4.12.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "sse-starlette>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "scrapers", "rag", "llm", "api", "tools"]
